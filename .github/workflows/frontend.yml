name: Frontend CI

on:
  push:
    paths:
      - 'src/web/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'src/web/**'
      - '.github/workflows/frontend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/web/package-lock.json

    - name: Install dependencies
      run: npm ci --prefix src/web

    - name: Lint
      run: npm run lint --prefix src/web

    - name: Type check
      run: npx tsc --noEmit -p src/web/tsconfig.app.json

    - name: Run tests
      run: npm run test --prefix src/web

    - name: Build
      run: npm run build --prefix src/web
